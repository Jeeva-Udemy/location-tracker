name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret. See README.md for how to create and add it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Ensure required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle assembleDebug -PMAPS_API_KEY="$MAPS_API_KEY" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: family-locator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
